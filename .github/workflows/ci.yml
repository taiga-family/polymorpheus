name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiga-family/ci/actions/setup/variables@1daabf6d988679e27745db6cd38227d6daca3b37 # v2.21.0
      - uses: taiga-family/ci/actions/setup/node@1daabf6d988679e27745db6cd38227d6daca3b37 # v2.21.0

      - run: |
          if [[ "${{ env.SUPPORT_AUTO_PUSH }}" == "true" ]]; then
              npm run prettier -- --write
              npm run stylelint -- --fix
              npm run lint -- --fix
          else
              npm run prettier -- --check
              npm run stylelint
              npm run lint
          fi

      - run: npm run cspell
      - run: npx nx build demo
      - run: npx nx build ng-polymorpheus
      - run: npx ngc -p tsconfig.spec.json --noEmit
      - run: npx nx test ng-polymorpheus
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      - uses: taiga-family/ci/actions/auto/push@1daabf6d988679e27745db6cd38227d6daca3b37 # v2.21.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
